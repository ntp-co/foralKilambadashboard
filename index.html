<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · Cadastro de parcelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecec;--sf:#fbfcfc;--ink:#12201f;--mu:#586866;--ln:#cdd7d6;--ac:#0b6e63;--ac2:#dff0ed;
--c0:#2f6fb3;--c1:#0b6e63;--c2:#8a5cc2;--c3:#c47f00;--c4:#3d8f3a;--c5:#8a8f94;--c6:#c2410c;--c7:#b4234f;--wa:#b45309;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--sf:#161f1e;--ink:#e6efee;--mu:#93a5a3;--ln:#2a3837;--ac:#3fc1ae;--ac2:#18332f;
--c0:#6aa5e8;--c1:#3fc1ae;--c2:#b793ea;--c3:#e8a93a;--c4:#74c26f;--c5:#a4a9ae;--c6:#f08a5a;--c7:#ee6f93;--wa:#f0b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1514;--sf:#161f1e;--ink:#e6efee;--mu:#93a5a3;--ln:#2a3837;--ac:#3fc1ae;--ac2:#18332f;
--c0:#6aa5e8;--c1:#3fc1ae;--c2:#b793ea;--c3:#e8a93a;--c4:#74c26f;--c5:#a4a9ae;--c6:#f08a5a;--c7:#ee6f93;--wa:#f0b04a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
.mono,td.n,td.c,.kv{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.sub{color:var(--mu);margin:4px 0 0;font-size:13px}
button,input{font:inherit;color:inherit}
.btn{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.flt{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.flt input[type=search],.flt input[type=number]{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 10px}
.flt input[type=search]{flex:1 1 240px;min-width:0}
.flt input[type=number]{width:92px}
.flt label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--ln);border-radius:12px;background:var(--sf);margin-bottom:14px;overflow:hidden}
.kp div{padding:14px 16px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);margin:0 -1px -1px 0}
.kp b{display:block;font-size:12px;font-weight:500;color:var(--mu)}
.kv{font-size:22px;font-weight:500;line-height:1.3}
.kp small{color:var(--mu);font-size:12px}
#ins ul{margin:0;padding-left:18px}#ins li{margin:5px 0}
#ins .wn{color:var(--wa)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.g .card{margin:0}
.row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.row:hover{background:var(--ac2)}
.row.off{opacity:.38}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.row .v{font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:right;min-width:74px}
.tg{display:inline-flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;float:right}
.tg button{border:0;background:none;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--mu)}
.tg button.on{background:var(--ac);color:#fff}
.hist{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:6px}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px}
.hist i{display:block;width:100%;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}
.hist span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mu);margin-top:4px;white-space:nowrap}
.hist em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12px;margin-bottom:3px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:relative;text-align:left;font-weight:500;color:var(--mu);padding:8px 10px;border-bottom:1px solid var(--ln);cursor:pointer;white-space:nowrap;user-select:none}
th[aria-sort=ascending]::after{content:" ↑"}th[aria-sort=descending]::after{content:" ↓"}
td{padding:7px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
td.c{white-space:nowrap}
td.c b{background:var(--ac2);color:var(--ac);padding:2px 7px;border-radius:6px;font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.z{color:var(--wa)}
.pg{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--mu);flex-wrap:wrap}
.em{padding:24px;text-align:center;color:var(--mu)}
</style>
</head>

<div class="w">
<header><div><h1>Cadastro de parcelas</h1><p class="sub" id="sub"></p></div><button class="btn" id="rs">Limpar filtros</button></header>
<div class="card flt">
<input type="search" id="q" placeholder="Pesquisar por nome, código ou Id" aria-label="Pesquisar">
<label>Área de <input type="number" id="mn" min="0" step="0.01" placeholder="0"> a <input type="number" id="mx" min="0" step="0.01" placeholder="máx."> ha</label>
<label><input type="checkbox" id="rp"> Só nomes repetidos</label>
<label><input type="checkbox" id="ns"> Ocultar “SN”</label>
<button class="btn" id="et" hidden></button>
</div>
<div class="kp" id="kp"></div>
<div class="card" id="ins"><h2>Leitura rápida</h2><ul id="il"></ul></div>
<div class="g">
<div class="card"><div class="tg" id="tg"><button class="on" data-m="a">ha</button><button data-m="n">registos</button></div><h2>Por descrição</h2><div id="cat"></div><p class="sub">Clique numa linha para filtrar.</p></div>
<div class="card"><h2>Distribuição por tamanho (ha)</h2><div class="hist" id="hs"></div></div>
<div class="card"><h2>Maiores titulares (excl. “SN”)</h2><div id="top"></div><p class="sub">Agrupados pela codificação; clique para ver as suas parcelas.</p></div>
</div>
<div class="card" style="margin-top:14px"><h2>Registos</h2>

</div>

const fm=c=>(c/100).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2});

const CNT={};R.forEach(r=>CNT[r.b]=(CNT[r.b]||0)+1);

const COLS=[["id","Id"],["n","Nome"],["d","Descrição"],["a","Área (ha)"],["c","Codificação"]];
const $=i=>document.getElementById(i);
function filt(sc){const q=S.q.trim().toLowerCase(),lo=S.mn===""?-1:Math.round(S.mn*100),hi=S.mx===""?1e12:Math.round(S.mx*100);
return R.filter(r=>(sc||!S.cats.size||S.cats.has(r.d))&&(!q||(r.n+" "+r.c+" "+r.id).toLowerCase().includes(q))&&r.a>=lo&&r.a<=hi&&(!S.ent||r.b===S.ent)&&(!S.rp||CNT[r.b]>1)&&(!S.ns||r.n!=="SN"));}
function grp(a,f){const m=new Map();a.forEach(r=>{const k=f(r);const o=m.get(k)||{k,a:0,n:0,r};o.a+=r.a;o.n++;m.set(k,o)});return[...m.values()];}
const pc=(x,t)=>t?(x/t*100).toLocaleString("pt-PT",{maximumFractionDigits:1})+"%":"0%";
function render(){
const F=filt(false),A=filt(true),sum=F.reduce((s,r)=>s+r.a,0);

$("sub").textContent=ni(R.length)+" registos · "+fm(TOT)+" ha · dados da planilha sem alterações"+(F.length!==R.length?" · a mostrar "+ni(F.length):"");

ins(F,sum);
const cg=grp(A,r=>r.d).sort((x,y)=>y[S.m]-x[S.m]),mxv=Math.max(1,...cg.map(o=>o[S.m]));
$("cat").innerHTML=cg.map(o=>"<div class=\"row"+(S.cats.size&&!S.cats.has(o.k)?" off":"")+"\" data-d=\""+es(o.k)+"\"><span class=t title=\""+es(o.k)+"\"><i class=dot style=\"background:"+col(o.k)+"\"></i>"+es(o.k)+"</span><span class=bar><i style=\"width:"+o[S.m]/mxv*100+"%;background:"+col(o.k)+"\"></i></span><span class=v>"+(S.m==="a"?fm(o.a):ni(o.n))+"</span></div>").join("")||"<p class=em>Sem dados</p>";
const bc=BINS.map(b=>{const x=F.filter(r=>r.a>=b[0]*100&&r.a<b[1]*100);return{l:b[2],n:x.length,a:x.reduce((s,r)=>s+r.a,0)}}),bm=Math.max(1,...bc.map(b=>b.n));
$("hs").innerHTML=bc.map(b=>"<div title=\""+b.n+" registos · "+fm(b.a)+" ha\"><em>"+b.n+"</em><i style=\"height:"+b.n/bm*140+"px\"></i><span>"+b.l+"</span></div>").join("");
const tp=grp(F.filter(r=>r.n!=="SN"),r=>r.b).sort((x,y)=>y.a-x.a).slice(0,10),tm=Math.max(1,...tp.map(o=>o.a));

table(F);}
function med(F){if(!F.length)return"–";const s=F.map(r=>r.a).sort((x,y)=>x-y),m=s.length>>1;return fm(s.length%2?s[m]:Math.round((s[m-1]+s[m])/2));}
function ins(F,sum){const L=[];
if(!F.length){$("il").innerHTML="<li>Nenhum registo corresponde aos filtros.</li>";return}
const cg=grp(F,r=>r.d).sort((x,y)=>y.a-x.a),t=cg[0];
L.push("<b>"+es(t.k)+"</b> é a descrição com mais área: "+fm(t.a)+" ha ("+pc(t.a,sum)+") em "+ni(t.n)+" registos.");

if(cn.k!==t.k)L.push("<b>"+es(cn.k)+"</b> tem mais registos ("+ni(cn.n)+"), mas só "+pc(cn.a,sum)+" da área.");

if(tp.length){const s5=tp.reduce((s,o)=>s+o.a,0);L.push("Os "+tp.length+" maiores titulares identificados somam "+fm(s5)+" ha ("+pc(s5,sum)+"); o maior é <b>"+es(tp[0].r.n)+"</b> ("+fm(tp[0].a)+" ha).");}
const sn=F.filter(r=>r.n==="SN");if(sn.length)L.push(ni(sn.length)+" registos têm o nome “SN” e somam "+fm(sn.reduce((s,r)=>s+r.a,0))+" ha ("+pc(sn.reduce((s,r)=>s+r.a,0),sum)+" da área).");
const rp=grp(nm,r=>r.b).filter(o=>o.n>1);if(rp.length)L.push(ni(rp.length)+" nomes aparecem em mais de um registo (excl. “SN”), totalizando "+ni(rp.reduce((s,o)=>s+o.n,0))+" parcelas; o mais frequente é <b>"+es(rp.sort((x,y)=>y.n-x.n)[0].r.n)+"</b> ("+rp[0].n+"×).");
const z=F.filter(r=>r.a===0);if(z.length)L.push("<span class=wn>Atenção: "+z.length+" registo(s) com área 0,00 ha (Id "+z.map(r=>r.id).join(", ")+") — convém verificar.</span>");
$("il").innerHTML=L.map(x=>"<li>"+x+"</li>").join("");}
function table(F){const k=S.k,d=S.dir;
F=F.slice().sort((x,y)=>{const a=x[k],b=y[k];return(typeof a==="number"?a-b:String(a).localeCompare(String(b),"pt",{numeric:true}))*d});
const P=20,np=Math.max(1,Math.ceil(F.length/P));if(S.pg>=np)S.pg=np-1;

$("tb").innerHTML=v.map(r=>"<tr><td class=n>"+r.id+"</td><td>"+es(r.n)+"</td><td><i class=dot style=\"background:"+col(r.d)+"\"></i>"+es(r.d)+"</td><td class=\"n"+(r.a===0?" z":"")+"\">"+fm(r.a)+"</td><td class=c><b>"+r.c+"</b></td></tr>").join("")||"<tr><td colspan=5 class=em>Nenhum registo encontrado.</td></tr>";
$("pi").textContent=F.length?(S.pg*P+1)+"–"+Math.min(F.length,S.pg*P+P)+" de "+ni(F.length)+" · página "+(S.pg+1)+"/"+np:"0 resultados";
$("pv").disabled=S.pg===0;$("nx").disabled=S.pg>=np-1;}
function go(){S.pg=0;render()}
$("q").oninput=e=>{S.q=e.target.value;go()};
$("mn").oninput=e=>{S.mn=e.target.value;go()};$("mx").oninput=e=>{S.mx=e.target.value;go()};
$("rp").onchange=e=>{S.rp=e.target.checked;go()};$("ns").onchange=e=>{S.ns=e.target.checked;go()};
$("et").onclick=()=>{S.ent="";go()};
$("rs").onclick=()=>{S.cats.clear();S.q=S.mn=S.mx=S.ent="";S.rp=S.ns=false;["q","mn","mx"].forEach(i=>$(i).value="");$("rp").checked=$("ns").checked=false;go()};
$("cat").onclick=e=>{const r=e.target.closest(".row");if(!r)return;const d=r.dataset.d;S.cats.has(d)?S.cats.delete(d):S.cats.add(d);go()};
$("top").onclick=e=>{const r=e.target.closest(".row");if(!r)return;S.ent=S.ent===r.dataset.e?"":r.dataset.e;go()};
$("tg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.m=b.dataset.m;[...$("tg").children].forEach(x=>x.classList.toggle("on",x===b));render()};
$("th").onclick=e=>{const h=e.target.closest("th");if(!h)return;const k=h.dataset.k;S.dir=S.k===k?-S.dir:1;S.k=k;render()};

render();
